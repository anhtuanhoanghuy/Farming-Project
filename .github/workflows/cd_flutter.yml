name: CD Flutter App
on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing GitHub secret: $variable" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          if [[ ! -s android/app/release-keystore.jks ]]; then
            echo "Decoded release keystore is empty" >&2
            exit 1
          fi

      - name: Build Flutter App
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/android/app/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Prepare release info
        id: info
        run: |
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${VERSION_LINE%%+*}"
          CODE="${VERSION_LINE##*+}"
          SRC=build/app/outputs/flutter-apk/app-release.apk
          SHA=$(sha256sum "$SRC" | awk '{print $1}')
          FILE="sense_connect_v${NAME}_${SHA:0:8}.apk"
          cp "$SRC" "$FILE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Google Drive
        id: drive
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          FILE="${{ steps.info.outputs.file }}"
          NAME="${{ steps.info.outputs.name }}"
          DIR="v${NAME%%.*}/v${NAME}"
          rclone copyto "$FILE" "gdrive:$DIR/$FILE" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          URL=$(rclone link "gdrive:$DIR/$FILE" --drive-root-folder-id "$DRIVE_FOLDER_ID")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          rm -f ~/.config/rclone/rclone.conf

      - name: Register release in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APK_URL: ${{ steps.drive.outputs.url }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          BODY=$(jq -n \
            --argjson code "${{ steps.info.outputs.code }}" \
            --arg name "${{ steps.info.outputs.name }}" \
            --arg url "$APK_URL" \
            --arg sha "${{ steps.info.outputs.sha }}" \
            --arg notes "$NOTES" \
            '{version_code:$code, version_name:$name, apk_url:$url, sha256:$sha, release_notes:$notes}')
          curl --fail-with-body -X POST "$SUPABASE_URL/rest/v1/app_releases" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$BODY"

      - name: Remove release keystore
        if: always()
        run: rm -f android/app/release-keystore.jks
